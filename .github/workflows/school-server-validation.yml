name: School Server Validation

on:
  push:
    branches:
      - feature/ai-native-foundation
      - main
  pull_request:
    paths:
      - 'school_server/**'
      - '.github/workflows/school-server-validation.yml'

permissions:
  contents: write

jobs:
  validate-school-server:
    name: Validate school_server
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: school_server

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Setup Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: '3.8.0'

      - name: Install dependencies
        run: dart pub get

      - name: Apply canonical Dart formatting
        run: dart format lib test bin

      - name: Commit formatting corrections
        working-directory: .
        run: |
          if git diff --quiet -- school_server/lib school_server/test school_server/bin; then
            echo "No formatting corrections needed."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add school_server/lib school_server/test school_server/bin
          git commit -m "style: apply canonical Dart formatting"
          git push origin "HEAD:${{ github.head_ref || github.ref_name }}"

      - name: Static analysis
        run: dart analyze

      - name: Run authentication tests
        run: dart test test/features/auth test/app

      - name: Run full test suite
        run: dart test
